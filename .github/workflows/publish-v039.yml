name: Publish Farming Pixel Dungeon v0.39.0
on:
  workflow_dispatch:
  push:
    branches: [extraction]
    paths: ['.github/workflows/publish-v039.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-farming-v039
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Download verified Android build
        uses: actions/download-artifact@v4
        with:
          name: echo-extraction-debug-apk
          run-id: 37800931159
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: release-input/android
      - name: Download verified Windows build
        uses: actions/download-artifact@v4
        with:
          name: farming-pc-windows
          run-id: 37800930774
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: release-input/windows
      - name: Stage the previously tested files
        run: |
          (cd release-input/android && sha256sum -c SHA256SUMS.txt)
          (cd release-input/windows && sed -i 's/\r$//' SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
          mkdir -p release-output
          cp release-input/android/android-debug.apk release-output/Farming_Pixel_Dungeon_v0.39.0.apk
          cp release-input/windows/Farming_Pixel_Dungeon_PC_v0.39.0_Windows.zip release-output/
          cd release-output
          sha256sum *.apk *.zip > SHA256SUMS.txt
      - name: Write bilingual release notes
        run: |
          cat > release-notes.md <<'NOTES'
          # 파밍픽셀던전 v0.39.0 / Farming Pixel Dungeon v0.39.0
          
          **Shattered Pixel Dungeon 모딩 작품입니다. AI를 사용했습니다.**
          **A mod of Shattered Pixel Dungeon, developed with AI assistance.**
          
          ## 한국어 변경 사항
          - **마법 지팡이 강화 상한 수정:** 티어가 없는 모든 마법 지팡이는 최대 **+15**까지 영구 강화할 수 있습니다. 기존에 +15를 초과한 지팡이는 저장을 불러올 때 +15로 조정됩니다.
          - +15 지팡이는 강화 스크롤·마법 융합의 선택 대상에서 제외되며, 상한에서 다시 강화해도 충전·저주·송진 상태가 바뀌지 않습니다.
          - 저주 융합·송진을 더한 장비 강화 수치에도 +15 상한을 적용하고 상세 설명에 상한을 표시합니다. 일시적인 주문 위력 효과는 유지합니다.
          - 재성장의 지팡이 설명·강화 미리보기를 로비에서 열 때 발생하던 오류를 수정했습니다.
          - 직전 버전의 **×1·×3·×5 애니메이션 버튼**도 포함됩니다. 원정 화면 오른쪽 위 메뉴 아래에서 전환하며 캐릭터 이동 속도는 유지합니다.
          
          ## English changes
          - **Magic wand upgrade cap fixed:** All non-tiered magic wands have a permanent **+15** upgrade ceiling. Loading an older wand above +15 reduces its upgrade level to +15.
          - Capped wands cannot be selected for upgrade scrolls or Magical Infusion. Blocked upgrades leave charges, curses, and resin unchanged.
          - Equipment levels including curse infusion and resin bonuses also respect +15, and wand descriptions show the ceiling. Temporary spell-power effects remain available.
          - Fixed Regrowth wand descriptions and upgrade previews crashing at the hub without an active hero.
          - Includes the preceding release's **×1/×3/×5 animation button**, below the top-right expedition menu. Character movement retains its original speed.
          
          ## 실행 / Playing
          - Android: install the APK below.
          - Windows 64-bit: extract the entire ZIP and run `FarmingPixelDungeon/FarmingPixelDungeon.exe`. Java is bundled.
          - 게임 UI는 한국어입니다. The game interface currently uses Korean labels.
          
          ## 검증 / Validation
          Core tests and Android build passed. Regression checks cover every generated wand type, the final allowed upgrade, blocked scroll and infusion selection, side-effect preservation, and legacy save migration. Windows build and native launch/resume checks passed. This is an in-development build.
          
          ## Credits / 제작자와 원작
          **gmray0126** — mod creator, design, and maintenance. **Evan Debenham / 00-Evan** — Shattered Pixel Dungeon. **Oleg Dolya / Watabou** — original Pixel Dungeon. Thanks to the upstream contributors for code, art, music, and translations. Upstream credits do not imply participation in or endorsement of this mod. AI assistance was used. Existing copyright notices are retained under GPL v3 or later.
          
          [게임 소개 / Project overview](https://github.com/gmray0126/farming-pixel-dungeon#readme) · [검증한 소스 / Tested source](https://github.com/gmray0126/farming-pixel-dungeon/tree/b4027e23f9c8af9d1073030804f59e173b81c4cb)
          NOTES
      - name: Publish Android and Windows downloads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v0.39.0-farming release-output/* --repo gmray0126/farming-pixel-dungeon --target "${{ github.sha }}" --title '파밍픽셀던전 v0.39.0 / Farming Pixel Dungeon' --notes-file release-notes.md --prerelease
