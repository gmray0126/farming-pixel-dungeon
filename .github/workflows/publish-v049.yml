name: Publish Farming Pixel Dungeon v0.49.0
on:
  workflow_dispatch:
  push:
    branches: [extraction]
    paths: ['.github/workflows/publish-v049.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-farming-v049
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Download verified Android build
        uses: actions/download-artifact@v4
        with:
          name: echo-extraction-debug-apk
          run-id: 38057080806
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: release-input/android
      - name: Download verified Windows build
        uses: actions/download-artifact@v4
        with:
          name: farming-pc-windows
          run-id: 38057080832
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: release-input/windows
      - name: Stage the previously tested files
        run: |
          (cd release-input/android && sha256sum -c SHA256SUMS.txt)
          (cd release-input/windows && sed -i 's/\r$//' SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
          mkdir -p release-output
          cp release-input/android/android-debug.apk release-output/Farming_Pixel_Dungeon_v0.49.0.apk
          cp release-input/windows/Farming_Pixel_Dungeon_PC_v0.49.0_Windows.zip release-output/
          cd release-output
          sha256sum *.apk *.zip > SHA256SUMS.txt
      - name: Write bilingual release notes
        run: |
          cat > release-notes.md <<'NOTES'
          # 파밍픽셀던전 v0.49.0 / Farming Pixel Dungeon v0.49.0
          
          **Shattered Pixel Dungeon 모딩 작품입니다. AI를 사용했습니다.**
          **A mod of Shattered Pixel Dungeon, developed with AI assistance.**
          
          ## 한국어 변경 사항
          - **금고 입장 수정:** 임프의 금고 입장 전 장비를 보관한 뒤 원정 분기 제한으로 이동이 막히던 오류를 수정했습니다.
          - 동굴의 광산과 도시의 금고를 같은 층의 원본 퀘스트 분기로 왕복할 수 있습니다. 다른 챕터 이동과 보스 우회는 허용하지 않습니다.
          - 금고 이동 가능 여부를 장비 보관과 회복 처리 전에 검사합니다. 입장 확인창에서도 현재 층과 이동 조건을 재검사합니다.
          - **기존 저장 복구:** 금고 밖인데 탈출 수정에 장비가 보관된 원정은 이어하기 때 원래 장비·골드·연금술 에너지를 복구합니다. 오류 이후 새로 얻은 물품과 재화도 보존합니다. 가방에 못 넣는 물품은 캐릭터 발밑에 놓습니다.
          - 복구는 한 번만 적용하며, 실제 금고 안에 있는 원정과 일반 원본 플레이의 퀘스트에는 적용하지 않습니다.
          
          ## English changes
          - **Fixed vault entry:** Raid route checks no longer reject the Imp vault after equipment has already been stored.
          - Native mine and vault side quests can be visited and left on the same chapter floor. Other chapter jumps and boss bypasses remain blocked.
          - Vault route validation occurs before healing or storing equipment and is repeated when confirming entry.
          - **Repair older saves:** Resuming an expedition outside the vault restores equipment, gold, and alchemy energy stranded in an Escape Crystal. Items and currency acquired after the failed entry are preserved; inventory overflow is placed at the hero's feet.
          - Recovery is applied once, and does not affect expeditions inside the actual vault or ordinary upstream quest play.
          
          ## 실행 / Playing
          - Android: install the APK below.
          - Windows 64-bit: extract the entire ZIP and run `FarmingPixelDungeon/FarmingPixelDungeon.exe`. Java is bundled.
          - 게임 UI는 한국어입니다. The game interface currently uses Korean labels.
          
          ## 검증 / Validation
          Core tests and Android build passed. Regression tests cover same-floor quest entry/return, route locks and boss bypass rejection, restored saved equipment and quickslots, later loot and currency, vault exclusion, and repeat recovery. Windows packaging and native launch/depart/resume checks passed. This is an in-development build.
          
          ## Credits / 제작자와 원작
          **gmray0126** — mod creator, design, and maintenance. **Evan Debenham / 00-Evan** — Shattered Pixel Dungeon. **Oleg Dolya / Watabou** — original Pixel Dungeon. Thanks to upstream contributors for code, art, music, and translations. Upstream credits do not imply participation in or endorsement of this mod. AI assistance was used. Existing copyright notices are retained under GPL v3 or later.
          
          [게임 소개 / Project overview](https://github.com/gmray0126/farming-pixel-dungeon#readme) · [검증한 소스 / Tested source](https://github.com/gmray0126/farming-pixel-dungeon/tree/051e5adc9d21fe4a1df26d5d08b579e45b30dfce)
          NOTES
      - name: Publish Android and Windows downloads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v0.49.0-farming release-output/* --repo gmray0126/farming-pixel-dungeon --target "${{ github.sha }}" --title '파밍픽셀던전 v0.49.0 / Farming Pixel Dungeon' --notes-file release-notes.md --prerelease
