name: Publish Farming Pixel Dungeon v0.61.0
on:
  workflow_dispatch:
  push:
    branches: [extraction]
    paths: ['.github/workflows/publish-v061.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-farming-v061
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Download verified Android build
        uses: actions/download-artifact@v4
        with:
          name: echo-extraction-debug-apk
          run-id: 38544905735
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: release-input/android
      - name: Download verified Windows build
        uses: actions/download-artifact@v4
        with:
          name: farming-pc-windows
          run-id: 38544905741
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: release-input/windows
      - name: Stage the previously tested files
        run: |
          (cd release-input/android && sha256sum -c SHA256SUMS.txt)
          (cd release-input/windows && sed -i 's/\r$//' SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
          mkdir -p release-output
          cp release-input/android/android-debug.apk release-output/Farming_Pixel_Dungeon_v0.61.0.apk
          cp release-input/windows/Farming_Pixel_Dungeon_PC_v0.61.0_Windows.zip release-output/
          cp core/src/main/assets/sprites/huntress.png release-output/Huntress_Original_256x128.png
          cd release-output
          sha256sum *.apk *.zip *.png > SHA256SUMS.txt
      - name: Write bilingual release notes
        run: |
          cat > release-notes.md <<'NOTES'
          # 파밍픽셀던전 v0.61.0 / Farming Pixel Dungeon v0.61.0
          
          **Shattered Pixel Dungeon 모딩 작품입니다. AI를 사용했습니다.**
          **A mod of Shattered Pixel Dungeon, developed with AI assistance.**
          
          ## 한국어 변경 사항
          - 원정의 일반 적·정예·보스 최종 회피 능력치를 기존의 75%로 낮췄습니다.
          - 모든 챕터와 일반·하드모드에 적용합니다. 챕터 및 정예 보정 이후 한 번만 적용되며, 진행 중인 원정에도 반영됩니다.
          - 회피 확률에서 25%p를 빼는 방식은 아닙니다. 명중과 회피 능력치가 같아서 50% 확률로 피하던 적은 조정 후 약 37.5%로 내려갑니다.
          - 플레이어·아군·중립 NPC와 훈련장 허수아비의 회피는 유지합니다. 특수 회피·무적 판정과 기습 공격 규칙도 유지합니다.
          
          ## English changes
          - Expedition enemies' final evasion rating is now 75% of its former value, including ordinary enemies, elites, and bosses.
          - Applies across all chapters, normal/hard modes, and ongoing expeditions. Applied once after chapter and elite modifiers.
          - This reduces the evasion rating rather than subtracting 25 percentage points from dodge chance. Equal attack/defense ratings previously gave 50% dodge; after adjustment this becomes approximately 37.5%.
          - Player, ally, neutral NPC, and training-dummy evasion remain unchanged. Special evasion/immunity and surprise-attack rules remain.
          
          ## 실행 / Playing
          - Android: install the APK below.
          - Windows 64-bit: extract the entire ZIP and run `FarmingPixelDungeon/FarmingPixelDungeon.exe`. Java is bundled.
          - 게임 UI는 한국어입니다. The game interface currently uses Korean labels.
          
          ## 검증 / Validation
          235 core regression tests and the Android build passed, including actual hit-roll sampling and boss/hard-mode/exclusion checks. Native Windows launch, departure, resume, portrait UI, ammunition-guide scrolling, and training checks passed. This is an in-development build.
          
          ## Credits / 제작자와 원작
          **gmray0126** — mod creator, design, and maintenance. **Evan Debenham / 00-Evan** — Shattered Pixel Dungeon. **Oleg Dolya / Watabou** — original Pixel Dungeon. Thanks to upstream contributors for code, art, music, and translations. Upstream credits do not imply participation in or endorsement of this mod. AI assistance was used. Existing copyright notices are retained under GPL v3 or later.
          
          [게임 소개 / Project overview](https://github.com/gmray0126/farming-pixel-dungeon#readme) · [검증한 소스 / Tested source](https://github.com/gmray0126/farming-pixel-dungeon/tree/412c8c3c6a7896fe0ed4f57898855d23c7fee030)
          NOTES
      - name: Publish Android and Windows downloads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v0.61.0-farming release-output/* --repo gmray0126/farming-pixel-dungeon --target "${{ github.sha }}" --title '파밍픽셀던전 v0.61.0 / Farming Pixel Dungeon' --notes-file release-notes.md --prerelease
