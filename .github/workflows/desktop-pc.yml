name: Farming Pixel Dungeon Windows
on:
  workflow_dispatch:
  push:
    branches: [extraction]
    paths:
      - '.github/workflows/desktop-pc.yml'
      - 'desktop/**'
      - 'core/**'
      - 'SPD-classes/**'
      - 'services/**'
      - '**/*.gradle'
      - 'scripts/windows-start.ps1'
permissions:
  contents: read
concurrency:
  group: desktop-pc-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    name: Build and start Windows portable game
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Build original desktop module
        shell: pwsh
        run: ./gradlew.bat :desktop:release --no-daemon --stacktrace
      - name: Bundle Windows executable with Java runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force pc-input, pc-output, pc-delivery | Out-Null
          $jar = Get-ChildItem desktop/build/libs/*.jar | Select-Object -First 1
          Copy-Item $jar.FullName pc-input/
          & "$env:JAVA_HOME/bin/jlink.exe" --module-path "$env:JAVA_HOME/jmods" --add-modules java.base,java.desktop,java.management,jdk.unsupported,jdk.crypto.ec,jdk.crypto.cryptoki,jdk.management --strip-debug --no-header-files --no-man-pages --compress=2 --output pc-runtime
          if ($LASTEXITCODE -ne 0) { throw 'Runtime bundle failed' }
          & "$env:JAVA_HOME/bin/jpackage.exe" --type app-image --name FarmingPixelDungeon --app-version 0.31.0 --input pc-input --main-jar $jar.Name --main-class com.shatteredpixel.shatteredpixeldungeon.desktop.DesktopLauncher --runtime-image pc-runtime --icon desktop/src/main/assets/icons/windows.ico --dest pc-output
          if ($LASTEXITCODE -ne 0) { throw 'Windows image failed' }
          Copy-Item desktop/README-PC.txt pc-output/README-PC.txt
          Copy-Item LICENSE.txt pc-output/LICENSE.txt
          Compress-Archive -Path pc-output/* -DestinationPath pc-delivery/Farming_Pixel_Dungeon_PC_v0.31_Windows.zip -CompressionLevel Optimal
          Get-FileHash pc-delivery/*.zip -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $([IO.Path]::GetFileName($_.Path))" } | Set-Content pc-delivery/SHA256SUMS.txt
      - name: Provide software graphics for the build machine
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://github.com/pal1000/mesa-dist-win/releases/download/26.2.4/mesa3d-26.2.4-release-msvc.7z' -OutFile mesa.7z
          7z x mesa.7z -omesa | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Test graphics extraction failed' }
          $gl = Get-ChildItem mesa -Filter opengl32.dll -Recurse | Where-Object { $_.Directory.Name -eq 'x64' } | Select-Object -First 1
          if (!$gl) { throw '64-bit test graphics missing' }
          Copy-Item "$($gl.Directory.FullName)/*.dll" pc-output/FarmingPixelDungeon/
      - name: Start, depart, and resume Windows game
        shell: pwsh
        run: ./scripts/windows-start.ps1
      - name: Save portable Windows game
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: farming-pc-windows
          path: pc-delivery/
          if-no-files-found: error
          retention-days: 30
      - name: Save desktop runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: farming-pc-runtime
          path: pc-evidence/
          if-no-files-found: ignore
