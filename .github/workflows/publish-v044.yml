name: Publish Farming Pixel Dungeon v0.44.0
on:
  workflow_dispatch:
  push:
    branches: [extraction]
    paths: ['.github/workflows/publish-v044.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-farming-v044
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Download verified Android build
        uses: actions/download-artifact@v4
        with:
          name: echo-extraction-debug-apk
          run-id: 37953268349
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: release-input/android
      - name: Download verified Windows build
        uses: actions/download-artifact@v4
        with:
          name: farming-pc-windows
          run-id: 37953268380
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: release-input/windows
      - name: Stage the previously tested files
        run: |
          (cd release-input/android && sha256sum -c SHA256SUMS.txt)
          (cd release-input/windows && sed -i 's/\r$//' SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
          mkdir -p release-output
          cp release-input/android/android-debug.apk release-output/Farming_Pixel_Dungeon_v0.44.0.apk
          cp release-input/windows/Farming_Pixel_Dungeon_PC_v0.44.0_Windows.zip release-output/
          cd release-output
          sha256sum *.apk *.zip > SHA256SUMS.txt
      - name: Write bilingual release notes
        run: |
          cat > release-notes.md <<'NOTES'
          # 파밍픽셀던전 v0.44.0 / Farming Pixel Dungeon v0.44.0
          
          **Shattered Pixel Dungeon 모딩 작품입니다. AI를 사용했습니다.**
          **A mod of Shattered Pixel Dungeon, developed with AI assistance.**
          
          ## 한국어 변경 사항
          - **프리셋 저장 오류 수정:** 빈 칸의 저장 버튼이 불러오기를 실행하며 '저장된 프리셋이 없습니다'라고 표시하던 오류를 고쳤습니다.
          - **저장 / 불러오기 메뉴:** 성장 지도 → 프리셋에서 '현재 배분 저장'과 '프리셋 불러오기'를 각각 선택합니다. 다음 화면에서 프리셋 1~3을 고릅니다.
          - 저장된 칸을 덮어쓸 때 확인창을 표시합니다. 불러오기에서 비어 있는 칸은 비활성화합니다.
          - 저장·불러오기 완료 후 성공 메시지와 남은·사용한 포인트를 표시하고 성장 지도를 갱신합니다.
          - 기존 프리셋, 장비, 경험치와 포인트를 유지합니다. 프리셋 전환은 기존 총 포인트 안에서만 가능하고, 원정 중에는 저장·불러오기를 사용할 수 없습니다.
          
          ## English changes
          - **Preset save fix:** Saving into an empty slot incorrectly executed Load and displayed 'No saved preset'. Fixed the menu callback.
          - **Explicit Save / Load:** Open Growth Map → Presets, then choose Save current allocation or Load preset, followed by slot 1–3.
          - Overwriting requires confirmation; empty slots are disabled when loading.
          - Successful operations display confirmation and remaining/spent points, then refresh the growth map.
          - Existing presets, equipment, experience, and points are preserved. Switching allocations uses the existing earned point pool; save/load is available only outside an expedition.
          
          ## 실행 / Playing
          - Android: install the APK below.
          - Windows 64-bit: extract the entire ZIP and run `FarmingPixelDungeon/FarmingPixelDungeon.exe`. Java is bundled.
          - 게임 UI는 한국어입니다. The game interface currently uses Korean labels.
          
          ## 검증 / Validation
          Core tests and the Android build passed, including existing preset save/reload, point-budget, prerequisite, and rollback tests. Windows packaging and native launch/depart/resume checks passed. This is an in-development build.
          
          ## Credits / 제작자와 원작
          **gmray0126** — mod creator, design, and maintenance. **Evan Debenham / 00-Evan** — Shattered Pixel Dungeon. **Oleg Dolya / Watabou** — original Pixel Dungeon. Thanks to upstream contributors for code, art, music, and translations. Upstream credits do not imply participation in or endorsement of this mod. AI assistance was used. Existing copyright notices are retained under GPL v3 or later.
          
          [게임 소개 / Project overview](https://github.com/gmray0126/farming-pixel-dungeon#readme) · [검증한 소스 / Tested source](https://github.com/gmray0126/farming-pixel-dungeon/tree/e539cfc3f94a5f2d7db0c67ed2bf81bf3905b29b)
          NOTES
      - name: Publish Android and Windows downloads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v0.44.0-farming release-output/* --repo gmray0126/farming-pixel-dungeon --target "${{ github.sha }}" --title '파밍픽셀던전 v0.44.0 / Farming Pixel Dungeon' --notes-file release-notes.md --prerelease
