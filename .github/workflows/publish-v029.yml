name: Publish Farming Pixel Dungeon v0.29
on:
  workflow_dispatch:
  push:
    branches: [extraction]
    paths: ['.github/workflows/publish-v029.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-farming-v029
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Download verified Android build
        uses: actions/download-artifact@v4
        with:
          name: echo-extraction-debug-apk
          run-id: 37710618231
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: release-input/android
      - name: Download verified Windows build
        uses: actions/download-artifact@v4
        with:
          name: farming-pc-windows
          run-id: 37710618242
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: release-input/windows
      - name: Stage the previously tested files
        run: |
          (cd release-input/android && sha256sum -c SHA256SUMS.txt)
          (cd release-input/windows && sed -i 's/\r$//' SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
          mkdir -p release-output
          cp release-input/android/android-debug.apk release-output/Farming_Pixel_Dungeon_v0.29.apk
          cp release-input/windows/Farming_Pixel_Dungeon_PC_v0.29_Windows.zip release-output/
          cd release-output
          sha256sum *.apk *.zip > SHA256SUMS.txt
      - name: Write bilingual release notes
        run: |
          cat > release-notes.md <<'NOTES'
          # 파밍픽셀던전 v0.29 / Farming Pixel Dungeon v0.29
          
          **Shattered Pixel Dungeon 모딩 작품입니다. AI를 사용했습니다.**
          **A mod of Shattered Pixel Dungeon, developed with AI assistance.**
          
          장비를 준비해 5층 원정을 떠나고 보스를 처치한 뒤 탈출해 장비와 성장 노드를 쌓는 게임입니다.
          
          ## 한국어 변경 사항
          - **식량:** 층의 자연 생성과 몬스터의 식량 드롭을 복구했습니다. 상점에서도 계속 구매할 수 있습니다.
          - **기본 장비:** 준비한 무기가 없으면 보급 낡은 검, 준비한 갑옷이 없으면 보급 천 갑옷을 지급합니다. 준비한 검이나 갑옷과 중복 지급되지 않습니다.
          - **돌멩이:** 새 원정마다 투척용 돌멩이 3개를 지급합니다. 기본 물통도 계속 지급합니다.
          - 보급 검과 갑옷은 판매할 수 없습니다. 변경하지 않은 보급 장비는 탈출 시 창고에 쌓이지 않으며, 강화하거나 문양을 새긴 장비는 보관됩니다.
          - 기본 지급 변경은 새 원정부터 적용됩니다. 이어하기는 저장된 소지품을 그대로 사용합니다.
          
          ## English changes
          Farming Pixel Dungeon is an equipment-farming mod built around five-floor expeditions, extraction, and permanent growth nodes.
          
          - **Food:** Natural floor spawns and food drops from monsters are restored. Food is still available in the shop.
          - **Starter equipment:** A free worn shortsword is issued when no weapon is prepared, and free cloth armor when no armor is prepared. Prepared equipment does not receive a duplicate fallback.
          - **Throwing stones:** Every new expedition receives three throwing stones, along with the existing waterskin.
          - Free fallback weapons and armor cannot be sold. Unmodified fallback gear does not accumulate in storage after extraction; upgraded or enchanted gear is retained.
          - Starter supplies apply to new expeditions. Resuming uses the saved inventory.
          
          ## 실행 / Playing
          - Android: install the APK below.
          - Windows 64-bit: extract the entire ZIP and run `FarmingPixelDungeon/FarmingPixelDungeon.exe`. Java is bundled.
          - 게임 UI는 한국어입니다. The game interface currently uses Korean labels.
          
          ## 검증 / Validation
          138 core automated tests and Android APK compilation passed. The Windows portable build passed its native startup, departure, and save/resume checks. This is an in-development build.
          
          ## Credits / 제작자와 원작
          **gmray0126** — mod creator, design, and maintenance. **Evan Debenham / 00-Evan** — Shattered Pixel Dungeon. **Oleg Dolya / Watabou** — original Pixel Dungeon. Thanks to the upstream contributors for code, art, music, and translations. Upstream credits do not imply participation in or endorsement of this mod. AI assistance was used. Existing copyright notices are retained under GPL v3 or later.
          
          [게임 소개 / Project overview](https://github.com/gmray0126/farming-pixel-dungeon#readme) · [모딩 소스 / Mod source](https://github.com/gmray0126/farming-pixel-dungeon/tree/803c52e3ec29026bd48f8d0196b765c6f22e0863)
          NOTES
      - name: Publish Android and Windows downloads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v0.29.0-farming release-output/* --repo gmray0126/farming-pixel-dungeon --target 803c52e3ec29026bd48f8d0196b765c6f22e0863 --title '파밍픽셀던전 v0.29 / Farming Pixel Dungeon' --notes-file release-notes.md --prerelease
