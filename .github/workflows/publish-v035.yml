name: Publish Farming Pixel Dungeon v0.35
on:
  workflow_dispatch:
  push:
    branches: [extraction]
    paths: ['.github/workflows/publish-v035.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-farming-v035
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Download verified Android build
        uses: actions/download-artifact@v4
        with:
          name: echo-extraction-debug-apk
          run-id: 37744267229
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: release-input/android
      - name: Download verified Windows build
        uses: actions/download-artifact@v4
        with:
          name: farming-pc-windows
          run-id: 37744267222
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: release-input/windows
      - name: Stage the previously tested files
        run: |
          (cd release-input/android && sha256sum -c SHA256SUMS.txt)
          (cd release-input/windows && sed -i 's/\r$//' SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
          mkdir -p release-output
          cp release-input/android/android-debug.apk release-output/Farming_Pixel_Dungeon_v0.35.apk
          cp release-input/windows/Farming_Pixel_Dungeon_PC_v0.35_Windows.zip release-output/
          cd release-output
          sha256sum *.apk *.zip > SHA256SUMS.txt
      - name: Write bilingual release notes
        run: |
          cat > release-notes.md <<'NOTES'
          # 파밍픽셀던전 v0.35 / Farming Pixel Dungeon v0.35
          
          **Shattered Pixel Dungeon 모딩 작품입니다. AI를 사용했습니다.**
          **A mod of Shattered Pixel Dungeon, developed with AI assistance.**
          
          ## 한국어 변경 사항
          - **시작층 비상탈출:** 각 챕터 시작층(1·6·11·16·21층)의 위 계단에서 비상탈출하여 거점으로 돌아갈 수 있습니다. 이동 전 확인창에서 정산 조건을 안내합니다.
          - 장비·전리품·획득 골드와 전투로 얻은 성장 경험치는 보존하며, 남은 포션·스크롤은 골드로 정산합니다.
          - **의뢰 제한:** 비상탈출한 원정의 토벌·기록 회수·납품·혼합 실전 진행도는 반영하지 않습니다. 수락한 의뢰와 이전 정상 탈출에서 저장한 진행도는 유지됩니다.
          - 비상탈출로 다음 챕터가 해금되거나 완주 경험치 보너스가 지급되지 않습니다.
          - 하수도 첫 계단의 원작 지상 복귀 제한을 원정 모드에 맞게 처리하고, 의뢰·챕터 안내를 갱신했습니다. 보스 처치 후 정상 탈출과 챕터 내 층간 이동은 기존대로 가능합니다.
          
          ## English changes
          - **Emergency extraction:** Ascend the starting staircase on floors 1, 6, 11, 16, or 21 to return to the hub. A confirmation explains the retreat conditions.
          - Equipment, loot, collected gold, and earned combat growth XP are retained. Remaining potions and scrolls are converted to gold.
          - **No contract credit:** Hunting, recovery, delivery, and hybrid practice progress from the retreating expedition is not banked. Accepted contracts and previously banked progress remain.
          - Emergency extraction grants neither next-chapter unlocks nor completion XP bonuses.
          - The original first-floor surface restriction is bypassed in expedition mode. Contract and chapter descriptions explain retreat rules. Normal boss extraction and travel within the chapter retain their existing behavior.
          
          ## 실행 / Playing
          - Android: install the APK below.
          - Windows 64-bit: extract the entire ZIP and run `FarmingPixelDungeon/FarmingPixelDungeon.exe`. Java is bundled.
          - 게임 UI는 한국어입니다. The game interface currently uses Korean labels.
          
          ## 검증 / Validation
          Core tests and Android build passed. Regression checks cover emergency stair routing in all five chapters, retained loot and combat XP, consumable conversion, all accepted contract progress, save persistence, and duplicate settlement protection. Windows build and native launch/resume checks passed. This is an in-development build.
          
          ## Credits / 제작자와 원작
          **gmray0126** — mod creator, design, and maintenance. **Evan Debenham / 00-Evan** — Shattered Pixel Dungeon. **Oleg Dolya / Watabou** — original Pixel Dungeon. Thanks to the upstream contributors for code, art, music, and translations. Upstream credits do not imply participation in or endorsement of this mod. AI assistance was used. Existing copyright notices are retained under GPL v3 or later.
          
          [게임 소개 / Project overview](https://github.com/gmray0126/farming-pixel-dungeon#readme) · [검증한 소스 / Tested source](https://github.com/gmray0126/farming-pixel-dungeon/tree/1ead2a7b265fc282e94e7b471a6986c0ca8445b8)
          NOTES
      - name: Publish Android and Windows downloads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v0.35.0-farming release-output/* --repo gmray0126/farming-pixel-dungeon --target "${{ github.sha }}" --title '파밍픽셀던전 v0.35 / Farming Pixel Dungeon' --notes-file release-notes.md --prerelease
