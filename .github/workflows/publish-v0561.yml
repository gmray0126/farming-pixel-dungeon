name: Publish Farming Pixel Dungeon v0.56.1
on:
  workflow_dispatch:
  push:
    branches: [extraction]
    paths: ['.github/workflows/publish-v0561.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-farming-v0561
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Download verified Android build
        uses: actions/download-artifact@v4
        with:
          name: echo-extraction-debug-apk
          run-id: 38373780100
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: release-input/android
      - name: Download verified Windows build
        uses: actions/download-artifact@v4
        with:
          name: farming-pc-windows
          run-id: 38373780092
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: release-input/windows
      - name: Stage the previously tested files
        run: |
          (cd release-input/android && sha256sum -c SHA256SUMS.txt)
          (cd release-input/windows && sed -i 's/\r$//' SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
          mkdir -p release-output
          cp release-input/android/android-debug.apk release-output/Farming_Pixel_Dungeon_v0.56.1.apk
          cp release-input/windows/Farming_Pixel_Dungeon_PC_v0.56.1_Windows.zip release-output/
          cp core/src/main/assets/sprites/huntress.png release-output/Huntress_Original_256x128.png
          cd release-output
          sha256sum *.apk *.zip *.png > SHA256SUMS.txt
      - name: Write bilingual release notes
        run: |
          cat > release-notes.md <<'NOTES'
          # 파밍픽셀던전 v0.56.1 / Farming Pixel Dungeon v0.56.1
          
          **Shattered Pixel Dungeon 모딩 작품입니다. AI를 사용했습니다.**
          **A mod of Shattered Pixel Dungeon, developed with AI assistance.**
          
          ## 한국어 변경 사항
          - 총포술사 계통 이름을 **마탄학자**로 바꾸고 노드·스킬 메뉴·총기 설명에 반영했습니다.
          - 마탄학자 트리를 **마법사와 궁수 사이**로 옮겼습니다.
          - 입문 선행 조건을 **마법사와 궁수 양쪽 첫 노드 습득**으로 변경했습니다. 암살자 첫 노드로는 새로 해금할 수 없습니다.
          - 기존에 배분한 노드와 저장된 프리셋은 유지합니다.
          
          ## English changes
          - Renamed the gun hybrid path to **Arcane Ballistician (마탄학자)** in the tree, skill menu, and firearm descriptions.
          - Moved the path between **Mage and Huntress** and changed its unlock prerequisites to both of their first nodes.
          - Existing allocations and saved presets retain their stable node IDs.
          
          ## 실행 / Playing
          - Android: install the APK below.
          - Windows 64-bit: extract the entire ZIP and run `FarmingPixelDungeon/FarmingPixelDungeon.exe`. Java is bundled.
          - 게임 UI는 한국어입니다. The game interface currently uses Korean labels.
          
          ## 검증 / Validation
          Core regression tests and the Android build passed, including the Mage/Huntress unlock requirements and tree position. Native Windows launch, departure, resume, portrait UI, and training checks passed. This is an in-development build.
          
          ## Credits / 제작자와 원작
          **gmray0126** — mod creator, design, and maintenance. **Evan Debenham / 00-Evan** — Shattered Pixel Dungeon. **Oleg Dolya / Watabou** — original Pixel Dungeon. Thanks to upstream contributors for code, art, music, and translations. Upstream credits do not imply participation in or endorsement of this mod. AI assistance was used. Existing copyright notices are retained under GPL v3 or later.
          
          [게임 소개 / Project overview](https://github.com/gmray0126/farming-pixel-dungeon#readme) · [검증한 소스 / Tested source](https://github.com/gmray0126/farming-pixel-dungeon/tree/19e8a80c43bb49e14f430ccddfa23d32a3bf3e84)
          NOTES
      - name: Publish Android and Windows downloads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v0.56.1-farming release-output/* --repo gmray0126/farming-pixel-dungeon --target "${{ github.sha }}" --title '파밍픽셀던전 v0.56.1 / Farming Pixel Dungeon' --notes-file release-notes.md --prerelease
