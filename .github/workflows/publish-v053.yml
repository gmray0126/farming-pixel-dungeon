name: Publish Farming Pixel Dungeon v0.53.0
on:
  workflow_dispatch:
  push:
    branches: [extraction]
    paths: ['.github/workflows/publish-v053.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-farming-v053
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Download verified Android build
        uses: actions/download-artifact@v4
        with:
          name: echo-extraction-debug-apk
          run-id: 38192003937
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: release-input/android
      - name: Download verified Windows build
        uses: actions/download-artifact@v4
        with:
          name: farming-pc-windows
          run-id: 38191686218
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: release-input/windows
      - name: Stage the previously tested files
        run: |
          (cd release-input/android && sha256sum -c SHA256SUMS.txt)
          (cd release-input/windows && sed -i 's/\r$//' SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
          mkdir -p release-output
          cp release-input/android/android-debug.apk release-output/Farming_Pixel_Dungeon_v0.53.0.apk
          cp release-input/windows/Farming_Pixel_Dungeon_PC_v0.53.0_Windows.zip release-output/
          cp core/src/main/assets/sprites/huntress.png release-output/Huntress_Original_256x128.png
          cd release-output
          sha256sum *.apk *.zip *.png > SHA256SUMS.txt
      - name: Write bilingual release notes
        run: |
          cat > release-notes.md <<'NOTES'
          # 파밍픽셀던전 v0.53.0 / Farming Pixel Dungeon v0.53.0
          
          **Shattered Pixel Dungeon 모딩 작품입니다. AI를 사용했습니다.**
          **A mod of Shattered Pixel Dungeon, developed with AI assistance.**
          
          ## 한국어 변경 사항
          - **자유로운 영혼 장비 합산 수정:** 기존에는 주무기와 몸통 갑옷만 계산하고 바지·신발은 빠져 있었습니다. 이제 주무기·몸통 갑옷·바지·신발의 보너스를 각각 더합니다.
          - **3단계 + T1 네 부위 = 일반 적 처치당 5 에너지:** 기본 1 + 각 부위 100%씩 4를 더합니다. 각 부위 보너스를 서로 곱하지 않습니다. 최대 에너지는 기존 10을 유지합니다.
          - 1단계는 T3 이하 부위당 +50%, 2단계는 T2 이하 +75%, 3단계는 T1 +100%를 적용합니다. 상위 티어는 이전 단계의 혜택을 유지하고, T4·T5에는 해당 보너스가 없습니다. 강화 수치는 티어 계산을 바꾸지 않습니다.
          - 장착한 물품만 계산합니다. 가방에 넣은 장비와 보조 무기는 제외합니다. 맨손 또는 완력의 반지의 격투 자세가 활성화된 동안에는 무기 보너스만 제외하며, 몸통 갑옷·바지·신발 보너스는 유지합니다. 소지품을 잃은 상태에서는 실제 사용할 수 있는 장비만 계산합니다.
          - **에너지 설명창에 현재 획득 배율 표시.** 적 종류별 기본 에너지와 보스 소환물 파밍 방지 규칙은 기존대로 유지합니다. 예를 들어 원래 0.5 에너지를 주는 적은 T1 네 부위·3단계에서 2.5를 줍니다.
          - v0.52의 3단계 장비 지급·기존 사용자 보상 복구도 포함합니다. 새로 노드를 찍거나 초기화할 필요 없이 착용 장비로 계산합니다.
          
          ## English changes
          - **Fixed Unencumbered Spirit equipment stacking.** Previously only the primary weapon and body armor counted. Pants and boots now add their own bonuses too.
          - **Rank three plus four T1 pieces grants 5 energy per regular enemy:** 1 base plus four +100% bonuses. Slot bonuses add; they do not multiply each other. The existing raid energy cap remains 10.
          - Rank one grants +50% per T3-or-lower piece; rank two grants +75% for T2-or-lower; rank three grants +100% for T1. Earlier-tier benefits remain, and T4/T5 receive no bonus. Upgrade level does not change item tier.
          - Only usable equipped items count, excluding backpack items and secondary weapons. Unarmed combat or active Brawler's Stance removes only the weapon bonus; the three armor slots still count. Lost-inventory rules remain respected.
          - **The energy tooltip shows the current gain multiplier.** Enemy-specific base rates and anti-farming rules remain. An enemy worth 0.5 base energy grants 2.5 with four T1 pieces at rank three.
          - Includes v0.52's rank-three equipment rewards and existing-owner recovery. No respec or relearning is needed for this stacking fix.
          
          ## 실행 / Playing
          - Android: install the APK below.
          - Windows 64-bit: extract the entire ZIP and run `FarmingPixelDungeon/FarmingPixelDungeon.exe`. Java is bundled.
          - 게임 UI는 한국어입니다. The game interface currently uses Korean labels.
          
          ## 검증 / Validation
          Core tests and Android build passed. Regression tests exercise actual kill-energy gains across all ranks and tiers, upgrade levels, four-slot stacking, unequipped gear, missing slots, bare hands, Brawler stance, lost inventory, fractional enemy rates, the cap, and hero save/resume. Windows packaging and native launch/depart/resume checks passed. This is an in-development build.
          
          ## Credits / 제작자와 원작
          **gmray0126** — mod creator, design, and maintenance. **Evan Debenham / 00-Evan** — Shattered Pixel Dungeon. **Oleg Dolya / Watabou** — original Pixel Dungeon. Thanks to upstream contributors for code, art, music, and translations. Upstream credits do not imply participation in or endorsement of this mod. AI assistance was used. Existing copyright notices are retained under GPL v3 or later.
          
          [게임 소개 / Project overview](https://github.com/gmray0126/farming-pixel-dungeon#readme) · [검증한 소스 / Tested source](https://github.com/gmray0126/farming-pixel-dungeon/tree/261bc8815f7aa798ec92dae391063ae22aed637e)
          NOTES
      - name: Publish Android and Windows downloads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v0.53.0-farming release-output/* --repo gmray0126/farming-pixel-dungeon --target "${{ github.sha }}" --title '파밍픽셀던전 v0.53.0 / Farming Pixel Dungeon' --notes-file release-notes.md --prerelease
