name: Publish Farming Pixel Dungeon v0.63.0
on:
  workflow_dispatch:
  push:
    branches: [extraction]
    paths: ['.github/workflows/publish-v063.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-farming-v063
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Download verified Android build
        uses: actions/download-artifact@v4
        with:
          name: echo-extraction-debug-apk
          run-id: 39351317019
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: release-input/android
      - name: Download verified Windows build
        uses: actions/download-artifact@v4
        with:
          name: farming-pc-windows
          run-id: 39351317039
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: release-input/windows
      - name: Stage the previously tested files
        run: |
          (cd release-input/android && sha256sum -c SHA256SUMS.txt)
          (cd release-input/windows && sed -i 's/\r$//' SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
          mkdir -p release-output
          cp release-input/android/android-debug.apk release-output/Farming_Pixel_Dungeon_v0.63.0.apk
          cp release-input/windows/Farming_Pixel_Dungeon_PC_v0.63.0_Windows.zip release-output/
          cp core/src/main/assets/sprites/huntress.png release-output/Huntress_Original_256x128.png
          cd release-output
          sha256sum *.apk *.zip *.png > SHA256SUMS.txt
      - name: Write bilingual release notes
        run: |
          cat > release-notes.md <<'NOTES'
          # 파밍픽셀던전 v0.63.0 / Farming Pixel Dungeon v0.63.0
          
          **Shattered Pixel Dungeon 모딩 작품입니다. AI를 사용했습니다.**
          **A mod of Shattered Pixel Dungeon, developed with AI assistance.**
          
          ## 한국어 변경 사항
          - 파밍픽셀던전 추가 유물 5종과 의뢰인의 인장을 던전 상점에서 판매하거나 변환할 수 있도록 수정했습니다. 기존 저장 유물에도 적용되며, 착용 중인 저주받은 유물의 판매 제한은 유지합니다.
          - 다른 무기를 준비해도 출격 시 보급 낡은 검 한 자루를 가방에 지급합니다. 무기를 준비하지 않으면 바로 장착하고, 보급 검을 이미 가져왔으면 중복 지급하지 않습니다. 준비 물품을 모두 가져올 수 있도록 가방 여유를 확보했습니다.
          - 사냥꾼 계통의 풀 보존과 숲지기 나무껍질이 원본 직업 대신 습득한 노드를 기준으로 작동하도록 수정했습니다. 저격수와 숲지기를 함께 배워도 적용됩니다.
          - 긴 풀을 헤쳐진 풀로 남기고, 헤쳐진 풀로 다시 이동해도 나무껍질을 갱신합니다. 재방문으로 씨앗·이슬 등 풀 전리품이 반복 생성되지 않습니다.
          - 나무껍질 설명에 단계별 수치 2/4/6, 현재 수치 범위의 무작위 물리 피해 방어, 매 턴 1 감소, 풀 이동·식물 발동으로 갱신되는 조건을 명시했습니다. 일반 짧은 잔디와 단순 대기는 갱신하지 않습니다.
          
          ## English changes
          - The five added artifacts and the Commission Seal can now be sold to dungeon merchants and transmuted, including saved items. Equipped cursed artifacts still cannot be sold.
          - Every new expedition supplies one basic sword even when another weapon is prepared. It is placed in the backpack, or equipped when no weapon was brought. Bringing a supplied sword prevents duplicate issuance. Reserved backpack space accommodates full prepared loadouts.
          - Huntress grass preservation and Warden Barkskin now follow learned nodes rather than the original hero class, including builds with both Sniper and Warden.
          - Tall grass becomes furrowed grass; moving through furrowed grass refreshes Barkskin without repeatedly generating grass loot.
          - Barkskin's node description now states its rank values (2/4/6), random physical damage blocking up to its current value, one-point decay each turn, and refresh conditions. Short grass and simply waiting do not refresh it.
          
          ## 실행 / Playing
          - Android: install the APK below.
          - Windows 64-bit: extract the entire ZIP and run `FarmingPixelDungeon/FarmingPixelDungeon.exe`. Java is bundled.
          - 게임 UI는 한국어입니다. The game interface currently uses Korean labels.
          
          ## 검증 / Validation
          241 core regression tests and the Android build passed, including saved artifact selling/transmutation, a full prepared loadout with a backup sword, and grass/Barkskin behavior with both subclasses. Native Windows launch, departure, resume, portrait UI, ammunition-guide scrolling, and training checks passed. This is an in-development build.
          
          ## Credits / 제작자와 원작
          **gmray0126** — mod creator, design, and maintenance. **Evan Debenham / 00-Evan** — Shattered Pixel Dungeon. **Oleg Dolya / Watabou** — original Pixel Dungeon. Thanks to upstream contributors for code, art, music, and translations. Upstream credits do not imply participation in or endorsement of this mod. AI assistance was used. Existing copyright notices are retained under GPL v3 or later.
          
          [게임 소개 / Project overview](https://github.com/gmray0126/farming-pixel-dungeon#readme) · [검증한 소스 / Tested source](https://github.com/gmray0126/farming-pixel-dungeon/tree/b81c820245bd46e5a6492dad6e8a16cde63a65d0)
          NOTES
      - name: Publish Android and Windows downloads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v0.63.0-farming release-output/* --repo gmray0126/farming-pixel-dungeon --target "${{ github.sha }}" --title '파밍픽셀던전 v0.63.0 / Farming Pixel Dungeon' --notes-file release-notes.md --prerelease
