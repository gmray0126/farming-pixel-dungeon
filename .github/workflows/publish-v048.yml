name: Publish Farming Pixel Dungeon v0.48.0
on:
  workflow_dispatch:
  push:
    branches: [extraction]
    paths: ['.github/workflows/publish-v048.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-farming-v048
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Download verified Android build
        uses: actions/download-artifact@v4
        with:
          name: echo-extraction-debug-apk
          run-id: 38027475290
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: release-input/android
      - name: Download verified Windows build
        uses: actions/download-artifact@v4
        with:
          name: farming-pc-windows
          run-id: 38027475283
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: release-input/windows
      - name: Stage the previously tested files
        run: |
          (cd release-input/android && sha256sum -c SHA256SUMS.txt)
          (cd release-input/windows && sed -i 's/\r$//' SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
          mkdir -p release-output
          cp release-input/android/android-debug.apk release-output/Farming_Pixel_Dungeon_v0.48.0.apk
          cp release-input/windows/Farming_Pixel_Dungeon_PC_v0.48.0_Windows.zip release-output/
          cd release-output
          sha256sum *.apk *.zip > SHA256SUMS.txt
      - name: Write bilingual release notes
        run: |
          cat > release-notes.md <<'NOTES'
          # 파밍픽셀던전 v0.48.0 / Farming Pixel Dungeon v0.48.0
          
          **Shattered Pixel Dungeon 모딩 작품입니다. AI를 사용했습니다.**
          **A mod of Shattered Pixel Dungeon, developed with AI assistance.**
          
          ## 한국어 변경 사항
          - **기력 상시 표시:** 기존 스킬 버튼 안에 현재 기력 / 100과 얇은 충전 막대를 표시합니다. 스킬 메뉴를 열지 않고도 남은 기력을 확인할 수 있습니다.
          - 사용과 회복을 즉시 반영하며, 50 미만은 노란색, 20 미만은 붉은색으로 표시합니다. 수치는 소수점 이하를 버려 실제로 사용할 수 있는 기력보다 높게 보이지 않게 합니다.
          - 버튼 크기·위치와 퀵슬롯 배치는 유지합니다. 별도 패널을 추가하지 않아 던전 화면을 더 가리지 않습니다. 모바일의 좁은 배치와 PC의 넓은 배치에서 같은 정보를 표시합니다.
          - 스킬 자원이 아직 없는 캐릭터는 기존 스킬 버튼만 표시합니다. 기력 소모·회복 규칙과 저장 데이터는 유지합니다.
          
          ## English changes
          - **Always-visible skill energy:** The existing Skills button now shows current energy / 100 and a thin charge meter, without opening the skill menu.
          - The display follows spending and regeneration. Below 50 it turns amber; below 20 it turns red. Counts round down to avoid overstating usable energy.
          - Button size, placement, and quickslot layout are preserved. No extra panel covers the dungeon. Compact mobile and wider PC layouts share the display.
          - Characters without a skill resource retain the ordinary Skills button. Energy mechanics and save data are unchanged.
          
          ## 실행 / Playing
          - Android: install the APK below.
          - Windows 64-bit: extract the entire ZIP and run `FarmingPixelDungeon/FarmingPixelDungeon.exe`. Java is bundled.
          - 게임 UI는 한국어입니다. The game interface currently uses Korean labels.
          
          ## 검증 / Validation
          Core tests and Android build passed. Windows packaging and native launch/depart/resume checks passed. This is an in-development build.
          
          ## Credits / 제작자와 원작
          **gmray0126** — mod creator, design, and maintenance. **Evan Debenham / 00-Evan** — Shattered Pixel Dungeon. **Oleg Dolya / Watabou** — original Pixel Dungeon. Thanks to upstream contributors for code, art, music, and translations. Upstream credits do not imply participation in or endorsement of this mod. AI assistance was used. Existing copyright notices are retained under GPL v3 or later.
          
          [게임 소개 / Project overview](https://github.com/gmray0126/farming-pixel-dungeon#readme) · [검증한 소스 / Tested source](https://github.com/gmray0126/farming-pixel-dungeon/tree/2c50b53b50941db525724d33521db68541ce056e)
          NOTES
      - name: Publish Android and Windows downloads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v0.48.0-farming release-output/* --repo gmray0126/farming-pixel-dungeon --target "${{ github.sha }}" --title '파밍픽셀던전 v0.48.0 / Farming Pixel Dungeon' --notes-file release-notes.md --prerelease
