name: Publish Farming Pixel Dungeon v0.52.0
on:
  workflow_dispatch:
  push:
    branches: [extraction]
    paths: ['.github/workflows/publish-v052.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-farming-v052
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Download verified Android build
        uses: actions/download-artifact@v4
        with:
          name: echo-extraction-debug-apk
          run-id: 38159836764
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: release-input/android
      - name: Download verified Windows build
        uses: actions/download-artifact@v4
        with:
          name: farming-pc-windows
          run-id: 38159836889
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: release-input/windows
      - name: Stage the previously tested files
        run: |
          (cd release-input/android && sha256sum -c SHA256SUMS.txt)
          (cd release-input/windows && sed -i 's/\r$//' SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
          mkdir -p release-output
          cp release-input/android/android-debug.apk release-output/Farming_Pixel_Dungeon_v0.52.0.apk
          cp release-input/windows/Farming_Pixel_Dungeon_PC_v0.52.0_Windows.zip release-output/
          cp core/src/main/assets/sprites/huntress.png release-output/Huntress_Original_256x128.png
          cd release-output
          sha256sum *.apk *.zip *.png > SHA256SUMS.txt
      - name: Write bilingual release notes
        run: |
          cat > release-notes.md <<'NOTES'
          # 파밍픽셀던전 v0.52.0 / Farming Pixel Dungeon v0.52.0
          
          **Shattered Pixel Dungeon 모딩 작품입니다. AI를 사용했습니다.**
          **A mod of Shattered Pixel Dungeon, developed with AI assistance.**
          
          ## 한국어 변경 사항
          - **자유로운 영혼 3단계 보상 누락 수정:** 원작의 특성 강화 시 장비 지급 처리가 거점 노드 습득에 연결되지 않아 발생했습니다. 이제 최초 3단계 습득 시 감정된 천 갑옷과 징 박힌 장갑을 각각 하나씩 창고에 지급합니다.
          - 징 박힌 장갑은 방어구가 아니라 **공격 속도가 빠른 T1 격투 무기**입니다. 격투 노드가 적용되며 준비 탭에서 출격 물품에 넣어 사용할 수 있습니다.
          - **1·2단계에서는 장비를 지급하지 않습니다.** 단계별 장비 티어에 따른 수도사 에너지 획득 보너스는 기존 규칙을 유지합니다.
          - **기존 3단계 사용자 자동 복구:** 보상이 없는 기존 프로필을 불러오면 창고에 한 번 보충합니다. 노드·포인트·골드와 진행 중인 원정의 장비는 유지합니다.
          - 보상 수령 기록은 프로필에 저장합니다. 노드 취소·초기화·재습득·프리셋 전환으로 장비를 반복 지급하지 않습니다. 프리셋으로 처음 습득하는 경우도 지급합니다.
          - 노드 습득과 장비 지급을 함께 저장하여 저장 실패 시 포인트·노드·장비·수령 기록을 되돌립니다. 노드 설명과 지급 안내를 추가했습니다.
          
          ## English changes
          - **Fixed missing Unencumbered Spirit rank-three rewards.** The upstream talent-upgrade equipment grant was not connected to hub node learning. The first rank-three acquisition now grants identified Cloth Armor and Gloves to the stash.
          - Gloves are a **fast tier-one fist weapon**, not armor. Fist nodes apply; prepare the weapon at the hub to bring it into an expedition.
          - **Ranks one and two do not grant equipment.** Existing Monk energy-gain rules remain unchanged.
          - **Existing rank-three owners receive one recovery** when their profile loads. Nodes, points, gold, and active raid equipment are preserved.
          - Reward history persists independently of allocation. Refunds, resets, relearning, and preset switching cannot recreate the gear. First acquisition through a preset also grants the reward.
          - Node learning and rewards are saved together. Failed saves roll back points, nodes, items, and reward history. Added clear node descriptions and reward notifications.
          
          ## 실행 / Playing
          - Android: install the APK below.
          - Windows 64-bit: extract the entire ZIP and run `FarmingPixelDungeon/FarmingPixelDungeon.exe`. Java is bundled.
          - 게임 UI는 한국어입니다. The game interface currently uses Korean labels.
          
          ## 검증 / Validation
          Core tests and Android build passed. Regression tests cover rank gating, first grants, existing-save recovery during an active raid, persistent reward history, refund/reset/preset duplication prevention, first acquisition through a preset, and save-failure rollback. Windows packaging and native launch/depart/resume checks passed. This is an in-development build.
          
          ## Credits / 제작자와 원작
          **gmray0126** — mod creator, design, and maintenance. **Evan Debenham / 00-Evan** — Shattered Pixel Dungeon. **Oleg Dolya / Watabou** — original Pixel Dungeon. Thanks to upstream contributors for code, art, music, and translations. Upstream credits do not imply participation in or endorsement of this mod. AI assistance was used. Existing copyright notices are retained under GPL v3 or later.
          
          [게임 소개 / Project overview](https://github.com/gmray0126/farming-pixel-dungeon#readme) · [검증한 소스 / Tested source](https://github.com/gmray0126/farming-pixel-dungeon/tree/1b72ec4f4af173cbdd9b19d862b79516f32e26b2)
          NOTES
      - name: Publish Android and Windows downloads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v0.52.0-farming release-output/* --repo gmray0126/farming-pixel-dungeon --target "${{ github.sha }}" --title '파밍픽셀던전 v0.52.0 / Farming Pixel Dungeon' --notes-file release-notes.md --prerelease
