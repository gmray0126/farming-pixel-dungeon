name: Publish Farming Pixel Dungeon v0.34
on:
  workflow_dispatch:
  push:
    branches: [extraction]
    paths: ['.github/workflows/publish-v034.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-farming-v034
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Download verified Android build
        uses: actions/download-artifact@v4
        with:
          name: echo-extraction-debug-apk
          run-id: 37733403207
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: release-input/android
      - name: Download verified Windows build
        uses: actions/download-artifact@v4
        with:
          name: farming-pc-windows
          run-id: 37733403243
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: release-input/windows
      - name: Stage the previously tested files
        run: |
          (cd release-input/android && sha256sum -c SHA256SUMS.txt)
          (cd release-input/windows && sed -i 's/\r$//' SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
          mkdir -p release-output
          cp release-input/android/android-debug.apk release-output/Farming_Pixel_Dungeon_v0.34.apk
          cp release-input/windows/Farming_Pixel_Dungeon_PC_v0.34_Windows.zip release-output/
          cd release-output
          sha256sum *.apk *.zip > SHA256SUMS.txt
      - name: Write bilingual release notes
        run: |
          cat > release-notes.md <<'NOTES'
          # 파밍픽셀던전 v0.34 / Farming Pixel Dungeon v0.34
          
          **Shattered Pixel Dungeon 모딩 작품입니다. AI를 사용했습니다.**
          **A mod of Shattered Pixel Dungeon, developed with AI assistance.**
          
          ## 한국어 변경 사항
          - **영혼의 활 이름 수정:** 관성 등 인챈트가 부여된 영혼의 활에 수식어가 정상적으로 표시됩니다. 이미 인챈트가 붙은 저장된 활도 적용됩니다.
          - **첨필 대상 수정:** 갑옷뿐 아니라 바지와 신발도 선택하여 문양을 새길 수 있습니다. 미식별 장비와 저주받은 장비에 대한 기존 제한은 유지됩니다.
          - 첨필 선택 안내를 ‘문양을 새길 방어구를 선택하세요’로 변경했습니다.
          
          ## English changes
          - **Spirit Bow naming:** The node-issued Spirit Bow now displays enchantment prefixes, including Kinetic. Existing enchanted bows in saves also use the corrected name.
          - **Stylus targeting:** Pants and boots can now be selected for inscription alongside body armor. Existing identification and curse restrictions are retained.
          - Updated the Korean stylus selection prompt to refer to armor pieces.
          
          ## 실행 / Playing
          - Android: install the APK below.
          - Windows 64-bit: extract the entire ZIP and run `FarmingPixelDungeon/FarmingPixelDungeon.exe`. Java is bundled.
          - 게임 UI는 한국어입니다. The game interface currently uses Korean labels.
          
          ## 검증 / Validation
          Core tests and Android build passed. Regression checks cover saved bow enchantment names, stylus selection and consumption for both clothing slots, inscription persistence, and rejected unidentified/cursed targets. Windows build and native launch/resume checks passed. This is an in-development build.
          
          ## Credits / 제작자와 원작
          **gmray0126** — mod creator, design, and maintenance. **Evan Debenham / 00-Evan** — Shattered Pixel Dungeon. **Oleg Dolya / Watabou** — original Pixel Dungeon. Thanks to the upstream contributors for code, art, music, and translations. Upstream credits do not imply participation in or endorsement of this mod. AI assistance was used. Existing copyright notices are retained under GPL v3 or later.
          
          [게임 소개 / Project overview](https://github.com/gmray0126/farming-pixel-dungeon#readme) · [검증한 소스 / Tested source](https://github.com/gmray0126/farming-pixel-dungeon/tree/e4df80a820f7ed71b23fefd5960eb7de042071f7)
          NOTES
      - name: Publish Android and Windows downloads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v0.34.0-farming release-output/* --repo gmray0126/farming-pixel-dungeon --target "${{ github.sha }}" --title '파밍픽셀던전 v0.34 / Farming Pixel Dungeon' --notes-file release-notes.md --prerelease
