name: Publish Farming Pixel Dungeon v0.43.0
on:
  workflow_dispatch:
  push:
    branches: [extraction]
    paths: ['.github/workflows/publish-v043.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-farming-v043
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Download verified Android build
        uses: actions/download-artifact@v4
        with:
          name: echo-extraction-debug-apk
          run-id: 37952022687
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: release-input/android
      - name: Download verified Windows build
        uses: actions/download-artifact@v4
        with:
          name: farming-pc-windows
          run-id: 37952022710
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: release-input/windows
      - name: Stage the previously tested files
        run: |
          (cd release-input/android && sha256sum -c SHA256SUMS.txt)
          (cd release-input/windows && sed -i 's/\r$//' SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
          mkdir -p release-output
          cp release-input/android/android-debug.apk release-output/Farming_Pixel_Dungeon_v0.43.0.apk
          cp release-input/windows/Farming_Pixel_Dungeon_PC_v0.43.0_Windows.zip release-output/
          cd release-output
          sha256sum *.apk *.zip > SHA256SUMS.txt
      - name: Write bilingual release notes
        run: |
          cat > release-notes.md <<'NOTES'
          # 파밍픽셀던전 v0.43.0 / Farming Pixel Dungeon v0.43.0
          
          **Shattered Pixel Dungeon 모딩 작품입니다. AI를 사용했습니다.**
          **A mod of Shattered Pixel Dungeon, developed with AI assistance.**
          
          ## 한국어 변경 사항
          - **무기 종류 표시:** 무기 상세창 맨 위에 종류와 적용 성장 계통을 표시합니다. 소검은 검 계통, 단검은 단검·쌍검 계통입니다. 석궁·활·투척무기는 활·투척, 방패는 둔기·방패, 채찍은 창, 낫은 도끼 계통임을 확인할 수 있습니다. 마법사의 지팡이와 마법 막대도 마도 계통을 표시합니다. 표시는 실제 전투 판정을 사용합니다.
          - **맨손 안내:** 맨손은 이미 격투 판정으로 격투 노드 효과를 받습니다. 격투 효과 노드 설명에 맨손(무기 미착용)·징 박힌 장갑·돌 건틀릿의 적용을 명시했습니다.
          - **하드 버튼:** 원정 난이도 버튼을 '하드'로 줄였습니다. 레어 장비 드롭과 보스 보장 안내는 원정 설명에서 확인합니다.
          - 장비 분류, 노드 수치, 난이도와 저장 규칙은 그대로입니다.
          
          ## English changes
          - **Weapon labels:** The top of weapon details now shows the weapon type and matching growth family, using the combat classifier. Shortswords use Sword growth; daggers use Dagger/Dual Blades. Crossbows, bows, and thrown weapons use Bow/Thrown; shields use Blunt/Shield; whips use Spear; scythes use Axe. Mage's Staff and wands show the Magic family.
          - **Unarmed guidance:** Unarmed combat already receives Fist growth bonuses. Fist effect nodes explicitly list bare hands, Studded Gloves, and Stone Gauntlet.
          - **Hard button:** Simplified the difficulty button to Hard. Rare drop and guaranteed boss reward information remains in expedition descriptions.
          - Combat classification, balance values, and save rules are unchanged.
          
          ## 실행 / Playing
          - Android: install the APK below.
          - Windows 64-bit: extract the entire ZIP and run `FarmingPixelDungeon/FarmingPixelDungeon.exe`. Java is bundled.
          - 게임 UI는 한국어입니다. The game interface currently uses Korean labels.
          
          ## 검증 / Validation
          All 170 core tests and the Android build passed. Windows packaging and native launch/depart/resume checks passed. This is an in-development build.
          
          ## Credits / 제작자와 원작
          **gmray0126** — mod creator, design, and maintenance. **Evan Debenham / 00-Evan** — Shattered Pixel Dungeon. **Oleg Dolya / Watabou** — original Pixel Dungeon. Thanks to upstream contributors for code, art, music, and translations. Upstream credits do not imply participation in or endorsement of this mod. AI assistance was used. Existing copyright notices are retained under GPL v3 or later.
          
          [게임 소개 / Project overview](https://github.com/gmray0126/farming-pixel-dungeon#readme) · [검증한 소스 / Tested source](https://github.com/gmray0126/farming-pixel-dungeon/tree/69c974d3fb565081896f17353579bc8d5bc31193)
          NOTES
      - name: Publish Android and Windows downloads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v0.43.0-farming release-output/* --repo gmray0126/farming-pixel-dungeon --target "${{ github.sha }}" --title '파밍픽셀던전 v0.43.0 / Farming Pixel Dungeon' --notes-file release-notes.md --prerelease
