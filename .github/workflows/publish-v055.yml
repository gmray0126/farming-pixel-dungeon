name: Publish Farming Pixel Dungeon v0.55.0
on:
  workflow_dispatch:
  push:
    branches: [extraction]
    paths: ['.github/workflows/publish-v055.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-farming-v055
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Download verified Android build
        uses: actions/download-artifact@v4
        with:
          name: echo-extraction-debug-apk
          run-id: 38329123573
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: release-input/android
      - name: Download verified Windows build
        uses: actions/download-artifact@v4
        with:
          name: farming-pc-windows
          run-id: 38329123588
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: release-input/windows
      - name: Stage the previously tested files
        run: |
          (cd release-input/android && sha256sum -c SHA256SUMS.txt)
          (cd release-input/windows && sed -i 's/\r$//' SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
          mkdir -p release-output
          cp release-input/android/android-debug.apk release-output/Farming_Pixel_Dungeon_v0.55.0.apk
          cp release-input/windows/Farming_Pixel_Dungeon_PC_v0.55.0_Windows.zip release-output/
          cp core/src/main/assets/sprites/huntress.png release-output/Huntress_Original_256x128.png
          cd release-output
          sha256sum *.apk *.zip *.png > SHA256SUMS.txt
      - name: Write bilingual release notes
        run: |
          cat > release-notes.md <<'NOTES'
          # 파밍픽셀던전 v0.55.0 / Farming Pixel Dungeon v0.55.0
          
          **Shattered Pixel Dungeon 모딩 작품입니다. AI를 사용했습니다.**
          **A mod of Shattered Pixel Dungeon, developed with AI assistance.**
          
          ## 한국어 변경 사항
          - **메마른 장미 영구 활성화:** 하수도의 슬픈 유령 퀘스트 보상을 한 번 받으면 활성화를 영구 저장합니다. 사망·포기·탈출·재실행 후에도 유지하며, NPC가 없는 감옥 등 다른 챕터에서도 소환과 장비 관리를 사용할 수 있습니다.
          - 새 원정으로 가져갈 때 이전 원정의 유령 소환 ID만 초기화합니다. 같은 원정 이어하기는 소환 상태를 유지하고, 장미 강화·꽃잎·유령에게 준 무기와 갑옷·남은 충전량은 보존합니다. 저주와 충전 등 기존 소환 조건은 그대로 적용됩니다.
          - 이전 버전은 퀘스트 완료 기록을 저장하지 않아 미소환 장미의 과거 활성화를 판별할 수 없습니다. 업데이트 시 기존 창고·준비 물품·출격 보관 물품의 장미에 한해 한 번 활성화를 복구합니다. 기존에 장미가 없던 사용자와 새 프로필의 신규 장미는 최초 퀘스트를 완료해야 합니다.
          - 영구 기록 저장에 실패하면 퀘스트 보상을 소비하지 않아 다시 받을 수 있습니다. 탈출 저장 실패도 기존 원정 장비와 소환 상태를 보존합니다.
          
          ## English changes
          - **Permanent Dried Rose awakening:** Claiming the Sad Ghost quest reward once records a permanent unlock. It survives death, abandonment, extraction, and restarts, allowing summoning and outfitting in later chapters without the sewer NPC.
          - Fresh expeditions clear only the old ghost summon ID. Continuing the same expedition preserves its summon state. Rose upgrades, petals, ghost weapons and armor, and remaining charge carry over. Existing curse and charge requirements still apply.
          - Older versions did not record quest completion, making previously activated but never-summoned roses indistinguishable from locked ones. A one-time migration recovers activation for roses already stored, prepared, or escrowed. New profiles and old profiles without an owned rose must still complete the first quest.
          - Failed permanent saves do not consume the quest reward, allowing a retry. Failed extraction saves preserve the live equipment and summon state.
          
          ## 실행 / Playing
          - Android: install the APK below.
          - Windows 64-bit: extract the entire ZIP and run `FarmingPixelDungeon/FarmingPixelDungeon.exe`. Java is bundled.
          - 게임 UI는 한국어입니다. The game interface currently uses Korean labels.
          
          ## 검증 / Validation
          203 core tests and the Android build passed. Rose regressions cover quest unlocks, death and abandonment, profile reloads, chapter-two summoning availability, same-raid save/resume, upgrade/petal/equipment/charge preservation, old actor ID clearing, existing-save recovery, new-drop quest requirements, and failed-save rollback. Windows packaging and native launch/depart/resume checks passed. This is an in-development build.
          
          ## Credits / 제작자와 원작
          **gmray0126** — mod creator, design, and maintenance. **Evan Debenham / 00-Evan** — Shattered Pixel Dungeon. **Oleg Dolya / Watabou** — original Pixel Dungeon. Thanks to upstream contributors for code, art, music, and translations. Upstream credits do not imply participation in or endorsement of this mod. AI assistance was used. Existing copyright notices are retained under GPL v3 or later.
          
          [게임 소개 / Project overview](https://github.com/gmray0126/farming-pixel-dungeon#readme) · [검증한 소스 / Tested source](https://github.com/gmray0126/farming-pixel-dungeon/tree/806b49669e42f12187023b5ae7c840e79f641a27)
          NOTES
      - name: Publish Android and Windows downloads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v0.55.0-farming release-output/* --repo gmray0126/farming-pixel-dungeon --target "${{ github.sha }}" --title '파밍픽셀던전 v0.55.0 / Farming Pixel Dungeon' --notes-file release-notes.md --prerelease
