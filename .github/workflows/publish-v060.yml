name: Publish Farming Pixel Dungeon v0.60.0
on:
  workflow_dispatch:
  push:
    branches: [extraction]
    paths: ['.github/workflows/publish-v060.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-farming-v060
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Download verified Android build
        uses: actions/download-artifact@v4
        with:
          name: echo-extraction-debug-apk
          run-id: 38516700988
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: release-input/android
      - name: Download verified Windows build
        uses: actions/download-artifact@v4
        with:
          name: farming-pc-windows
          run-id: 38516700883
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: release-input/windows
      - name: Stage the previously tested files
        run: |
          (cd release-input/android && sha256sum -c SHA256SUMS.txt)
          (cd release-input/windows && sed -i 's/\r$//' SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
          mkdir -p release-output
          cp release-input/android/android-debug.apk release-output/Farming_Pixel_Dungeon_v0.60.0.apk
          cp release-input/windows/Farming_Pixel_Dungeon_PC_v0.60.0_Windows.zip release-output/
          cp core/src/main/assets/sprites/huntress.png release-output/Huntress_Original_256x128.png
          cd release-output
          sha256sum *.apk *.zip *.png > SHA256SUMS.txt
      - name: Write bilingual release notes
        run: |
          cat > release-notes.md <<'NOTES'
          # 파밍픽셀던전 v0.60.0 / Farming Pixel Dungeon v0.60.0
          
          **Shattered Pixel Dungeon 모딩 작품입니다. AI를 사용했습니다.**
          **A mod of Shattered Pixel Dungeon, developed with AI assistance.**
          
          ## 한국어 변경 사항
          - 돌멩이·투척 단검·수리검·창·볼라·부메랑·투척 망치·힘의 큐브·다트 등 일반 투척무기에 장착·해제 메뉴를 제공합니다.
          - 주무기로 장착하고 적을 누르면 근접 평타 대신 실제 투척을 합니다. 기존 투척의 명중·강화·투척의 반지·성장 노드·내구도·회수 규칙을 사용합니다.
          - 장착한 묶음에서 한 개씩 던지고 같은 묶음의 무기를 회수하면 장착 수량에 합쳐집니다. 가방이 가득 차 있어도 회수할 수 있습니다. 다른 묶음은 별도로 보관합니다.
          - 마지막 한 개를 던지면 주무기 칸이 비어 맨손으로 공격합니다. 마지막 투척에 추가 장비 교체 턴을 부과하지 않습니다.
          - 벽과 중간의 적을 고려하여 투척 가능한 대상에만 바로 공격합니다. 마지막 강화 투척무기가 부서질 때의 확인창과 저주 장비 제한은 유지합니다.
          - 투척무기만 준비했을 때 자동 장착되는 기존 동작과 가방·퀵슬롯 투척도 유지합니다. 실제 아이템이 아닌 총탄 효과는 장착 메뉴에서 제외합니다.
          
          ## English changes
          - Ordinary thrown weapons now offer Equip and Unequip actions, including stones, knives, shurikens, spears, bolas, boomerangs, hammers, force cubes, and darts.
          - Equip a stack in the primary weapon slot and select an enemy to perform a real throw rather than a free melee attack. Normal accuracy, upgrades, Sharpshooting, growth bonuses, durability, and recovery rules apply.
          - Each throw consumes one projectile from the equipped stack. Recovered members of the same set refill that stack even when the backpack is full; unrelated sets remain separate.
          - Throwing the final projectile empties the weapon slot and returns to unarmed attacks, without an additional equipment-swap turn.
          - Projectile obstacles are respected. Existing upgraded-last-projectile break warnings and cursed-equipment restrictions remain.
          - Existing expedition auto-equipping and inventory/quickslot throws remain supported. Effect-only gun projectiles cannot be equipped.
          
          ## 실행 / Playing
          - Android: install the APK below.
          - Windows 64-bit: extract the entire ZIP and run `FarmingPixelDungeon/FarmingPixelDungeon.exe`. Java is bundled.
          - 게임 UI는 한국어입니다. The game interface currently uses Korean labels.
          
          ## 검증 / Validation
          232 core regression tests and the Android build passed. Native Windows launch, departure, resume, portrait UI, ammunition-guide scrolling, and training checks passed. This is an in-development build.
          
          ## Credits / 제작자와 원작
          **gmray0126** — mod creator, design, and maintenance. **Evan Debenham / 00-Evan** — Shattered Pixel Dungeon. **Oleg Dolya / Watabou** — original Pixel Dungeon. Thanks to upstream contributors for code, art, music, and translations. Upstream credits do not imply participation in or endorsement of this mod. AI assistance was used. Existing copyright notices are retained under GPL v3 or later.
          
          [게임 소개 / Project overview](https://github.com/gmray0126/farming-pixel-dungeon#readme) · [검증한 소스 / Tested source](https://github.com/gmray0126/farming-pixel-dungeon/tree/b74e4193eca84e2099ff7e6a7d9e12668e7752c3)
          NOTES
      - name: Publish Android and Windows downloads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v0.60.0-farming release-output/* --repo gmray0126/farming-pixel-dungeon --target "${{ github.sha }}" --title '파밍픽셀던전 v0.60.0 / Farming Pixel Dungeon' --notes-file release-notes.md --prerelease
