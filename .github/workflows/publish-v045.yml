name: Publish Farming Pixel Dungeon v0.45.0
on:
  workflow_dispatch:
  push:
    branches: [extraction]
    paths: ['.github/workflows/publish-v045.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-farming-v045
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Download verified Android build
        uses: actions/download-artifact@v4
        with:
          name: echo-extraction-debug-apk
          run-id: 37954144957
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: release-input/android
      - name: Download verified Windows build
        uses: actions/download-artifact@v4
        with:
          name: farming-pc-windows
          run-id: 37954145231
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: release-input/windows
      - name: Stage the previously tested files
        run: |
          (cd release-input/android && sha256sum -c SHA256SUMS.txt)
          (cd release-input/windows && sed -i 's/\r$//' SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
          mkdir -p release-output
          cp release-input/android/android-debug.apk release-output/Farming_Pixel_Dungeon_v0.45.0.apk
          cp release-input/windows/Farming_Pixel_Dungeon_PC_v0.45.0_Windows.zip release-output/
          cd release-output
          sha256sum *.apk *.zip > SHA256SUMS.txt
      - name: Write bilingual release notes
        run: |
          cat > release-notes.md <<'NOTES'
          # 파밍픽셀던전 v0.45.0 / Farming Pixel Dungeon v0.45.0
          
          **Shattered Pixel Dungeon 모딩 작품입니다. AI를 사용했습니다.**
          **A mod of Shattered Pixel Dungeon, developed with AI assistance.**
          
          ## 한국어 변경 사항
          - **마탄의 지팡이 +15:** 마법사의 지팡이 본체가 T1 근접무기로 판정되어 +3에서 막히던 제한을 +15로 변경했습니다. 다른 마법 막대를 융합한 지팡이에도 적용합니다. 융합된 마법 막대의 레벨도 지팡이와 함께 최대 +15로 유지합니다.
          - 상세 설명에 지팡이의 +15 강화 상한을 표시합니다. +15에 도달하면 추가 강화가 차단됩니다.
          - **프리셋 수정 포함:** 빈 칸의 저장 버튼이 불러오기를 실행하던 오류를 수정했습니다. 성장 지도 → 프리셋에서 현재 배분 저장 / 프리셋 불러오기를 각각 선택한 뒤 1~3번 칸을 고릅니다. 덮어쓰기 확인, 빈 칸 불러오기 비활성화, 성공 메시지와 포인트 표시를 제공합니다.
          - 기존 장비, 경험치, 포인트와 프리셋은 유지합니다. 과거 제한으로 이미 줄어든 강화 수치는 자동 복원하지 않으며, 이후 강화부터 새 상한을 적용합니다.
          
          ## English changes
          - **Mage's Staff +15:** The staff body, including its Magic Missile form, now caps at +15 instead of the tier-one melee cap of +3. This also applies after imbuing another wand. The bound wand remains synchronized, with a maximum level of +15.
          - Staff details display the +15 cap; further upgrades are blocked at the limit.
          - **Includes preset fix:** Empty-slot Save no longer executes Load. Growth Map → Presets offers separate Save current allocation and Load preset actions, followed by slots 1–3. Overwrites require confirmation, empty slots cannot be loaded, and success messages display remaining/spent points.
          - Existing gear and progression are preserved. Upgrade levels already reduced by earlier caps are not automatically restored; subsequent upgrades use the new limit.
          
          ## 실행 / Playing
          - Android: install the APK below.
          - Windows 64-bit: extract the entire ZIP and run `FarmingPixelDungeon/FarmingPixelDungeon.exe`. Java is bundled.
          - 게임 UI는 한국어입니다. The game interface currently uses Korean labels.
          
          ## 검증 / Validation
          Core tests and Android build passed. Staff tests cover imbuing, +14 to +15, blocking further upgrades, bound-wand synchronization, and save/restore. Existing preset tests passed. Windows packaging and native launch/depart/resume checks passed. This is an in-development build.
          
          ## Credits / 제작자와 원작
          **gmray0126** — mod creator, design, and maintenance. **Evan Debenham / 00-Evan** — Shattered Pixel Dungeon. **Oleg Dolya / Watabou** — original Pixel Dungeon. Thanks to upstream contributors for code, art, music, and translations. Upstream credits do not imply participation in or endorsement of this mod. AI assistance was used. Existing copyright notices are retained under GPL v3 or later.
          
          [게임 소개 / Project overview](https://github.com/gmray0126/farming-pixel-dungeon#readme) · [검증한 소스 / Tested source](https://github.com/gmray0126/farming-pixel-dungeon/tree/c64e61a17f4bbc4be76b81e0f4d49a4e931a8d7f)
          NOTES
      - name: Publish Android and Windows downloads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v0.45.0-farming release-output/* --repo gmray0126/farming-pixel-dungeon --target "${{ github.sha }}" --title '파밍픽셀던전 v0.45.0 / Farming Pixel Dungeon' --notes-file release-notes.md --prerelease
