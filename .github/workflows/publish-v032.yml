name: Publish Farming Pixel Dungeon v0.32
on:
  workflow_dispatch:
  push:
    branches: [extraction]
    paths: ['.github/workflows/publish-v032.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-farming-v032
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Download verified Android build
        uses: actions/download-artifact@v4
        with:
          name: echo-extraction-debug-apk
          run-id: 37715164398
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: release-input/android
      - name: Download verified Windows build
        uses: actions/download-artifact@v4
        with:
          name: farming-pc-windows
          run-id: 37715164320
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: release-input/windows
      - name: Stage the previously tested files
        run: |
          (cd release-input/android && sha256sum -c SHA256SUMS.txt)
          (cd release-input/windows && sed -i 's/\r$//' SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
          mkdir -p release-output
          cp release-input/android/android-debug.apk release-output/Farming_Pixel_Dungeon_v0.32.apk
          cp release-input/windows/Farming_Pixel_Dungeon_PC_v0.32_Windows.zip release-output/
          cd release-output
          sha256sum *.apk *.zip > SHA256SUMS.txt
      - name: Write bilingual release notes
        run: |
          cat > release-notes.md <<'NOTES'
          # 파밍픽셀던전 v0.32 / Farming Pixel Dungeon v0.32
          
          **Shattered Pixel Dungeon 모딩 작품입니다. AI를 사용했습니다.**
          **A mod of Shattered Pixel Dungeon, developed with AI assistance.**
          
          장비를 준비해 5층 원정을 떠나고 보스를 처치한 뒤 탈출해 장비와 성장 노드를 쌓는 게임입니다.
          
          ## 한국어 변경 사항
          - 원정 중 **스킬 버튼을 인벤토리 가방 바로 위로 이동**했습니다.
          - 가방의 위치를 기준으로 배치하므로 모바일·PC 인터페이스와 도구 모음 배치 변경에 맞춰 함께 움직입니다.
          - 스킬 버튼의 기능은 동일합니다.
          
          ## English changes
          Farming Pixel Dungeon is an equipment-farming mod built around five-floor expeditions, extraction, and permanent growth nodes.
          
          - Moved the expedition **Skills button directly above the inventory bag**.
          - Anchored it to the bag so it follows the mobile and desktop toolbar layouts.
          - Existing skill actions are retained.
          
          ## 실행 / Playing
          - Android: install the APK below.
          - Windows 64-bit: extract the entire ZIP and run `FarmingPixelDungeon/FarmingPixelDungeon.exe`. Java is bundled.
          - 게임 UI는 한국어입니다. The game interface currently uses Korean labels.
          
          ## 검증 / Validation
          Android core tests and APK build passed. Windows build and native launch/resume checks passed. This is an in-development build.
          
          ## Credits / 제작자와 원작
          **gmray0126** — mod creator, design, and maintenance. **Evan Debenham / 00-Evan** — Shattered Pixel Dungeon. **Oleg Dolya / Watabou** — original Pixel Dungeon. Thanks to the upstream contributors for code, art, music, and translations. Upstream credits do not imply participation in or endorsement of this mod. AI assistance was used. Existing copyright notices are retained under GPL v3 or later.
          
          [게임 소개 / Project overview](https://github.com/gmray0126/farming-pixel-dungeon#readme) · [모딩 소스 / Mod source](https://github.com/gmray0126/farming-pixel-dungeon/tree/2f0b4439d23a61997a3af88b8eec0157bcee8226)
          NOTES
      - name: Publish Android and Windows downloads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v0.32.0-farming release-output/* --repo gmray0126/farming-pixel-dungeon --target 2f0b4439d23a61997a3af88b8eec0157bcee8226 --title '파밍픽셀던전 v0.32 / Farming Pixel Dungeon' --notes-file release-notes.md --prerelease
