name: Publish Farming Pixel Dungeon v0.37
on:
  workflow_dispatch:
  push:
    branches: [extraction]
    paths: ['.github/workflows/publish-v037.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-farming-v037
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Download verified Android build
        uses: actions/download-artifact@v4
        with:
          name: echo-extraction-debug-apk
          run-id: 37783485717
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: release-input/android
      - name: Download verified Windows build
        uses: actions/download-artifact@v4
        with:
          name: farming-pc-windows
          run-id: 37783485939
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: release-input/windows
      - name: Stage the previously tested files
        run: |
          (cd release-input/android && sha256sum -c SHA256SUMS.txt)
          (cd release-input/windows && sed -i 's/\r$//' SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
          mkdir -p release-output
          cp release-input/android/android-debug.apk release-output/Farming_Pixel_Dungeon_v0.37.apk
          cp release-input/windows/Farming_Pixel_Dungeon_PC_v0.37_Windows.zip release-output/
          cd release-output
          sha256sum *.apk *.zip > SHA256SUMS.txt
      - name: Write bilingual release notes
        run: |
          cat > release-notes.md <<'NOTES'
          # 파밍픽셀던전 v0.37 / Farming Pixel Dungeon v0.37
          
          **Shattered Pixel Dungeon 모딩 작품입니다. AI를 사용했습니다.**
          **A mod of Shattered Pixel Dungeon, developed with AI assistance.**
          
          ## 한국어 변경 사항
          - **하수도 유물 드롭 복구:** 삭제된 난이도 단계에 따른 유물 전체 차단을 제거했습니다. 하수도에서 기존 무작위 유물과 불안정한 나침반이 등장하며, 나머지 신규 유물은 감옥부터 등장합니다. 기존의 보스 추가 유물 확률은 유지됩니다.
          - 드롭 대상 필터가 유물 목록을 영구 삭제하지 않도록 수정했습니다. 구버전에서 차단된 진행 중 하수도 원정의 유물 목록은 한 번 복구하며, 가져간 유물의 중복 생성 제한은 유지합니다.
          - **갑옷 강화 상한:** 천·가죽·사슬·미늘·판금갑옷에 T1 +3 / T2 +6 / T3 +9 / T4 +12 / T5 +15 상한을 적용했습니다. 강화 스크롤, 마법 부여, 직접 강화, 저주 주입에 적용됩니다.
          - 갑옷 설명에 상한을 표시합니다. 기존 상한 초과 갑옷은 불러올 때 조정되며, 직업 갑옷 변환·이식·저장 복원도 원래 티어를 기준으로 제한합니다.
          
          ## English changes
          - **Sewer artifact drops restored:** Removed the obsolete stage-based blanket artifact block. Existing random artifacts and the Unstable Compass can appear in the Sewers; the other new relics appear from the Prison onward. Existing additional boss artifact chances are unchanged.
          - Artifact filtering no longer permanently removes temporarily ineligible relics from the deck. Legacy blocked sewer decks are repaired once, retaining exclusions for artifacts brought into the expedition.
          - **Body armor upgrade caps:** Cloth, leather, mail, scale, and plate armor are limited to T1 +3 / T2 +6 / T3 +9 / T4 +12 / T5 +15. Scrolls, magical infusion, direct upgrades, and curse infusion respect these limits.
          - Armor descriptions display the limit. Over-cap legacy armor is clamped when loaded. Class armor conversion, transfer, and restoration use the original armor tier.
          
          ## 실행 / Playing
          - Android: install the APK below.
          - Windows 64-bit: extract the entire ZIP and run `FarmingPixelDungeon/FarmingPixelDungeon.exe`. Java is bundled.
          - 게임 UI는 한국어입니다. The game interface currently uses Korean labels.
          
          ## 검증 / Validation
          Core tests and Android build passed. Regression checks cover eligible sewer artifacts, uniqueness, later-chapter eligibility, one-time legacy deck repair, all body armor tier caps, blocked upgrade selection, infusion, old saves, and class armor conversion. Windows build and native launch/resume checks passed. This is an in-development build.
          
          ## Credits / 제작자와 원작
          **gmray0126** — mod creator, design, and maintenance. **Evan Debenham / 00-Evan** — Shattered Pixel Dungeon. **Oleg Dolya / Watabou** — original Pixel Dungeon. Thanks to the upstream contributors for code, art, music, and translations. Upstream credits do not imply participation in or endorsement of this mod. AI assistance was used. Existing copyright notices are retained under GPL v3 or later.
          
          [게임 소개 / Project overview](https://github.com/gmray0126/farming-pixel-dungeon#readme) · [검증한 소스 / Tested source](https://github.com/gmray0126/farming-pixel-dungeon/tree/3eb4b6ae9592614b218f82d545d746b5b5ceae8c)
          NOTES
      - name: Publish Android and Windows downloads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v0.37.0-farming release-output/* --repo gmray0126/farming-pixel-dungeon --target "${{ github.sha }}" --title '파밍픽셀던전 v0.37 / Farming Pixel Dungeon' --notes-file release-notes.md --prerelease
