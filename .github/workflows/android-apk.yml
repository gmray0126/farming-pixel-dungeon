name: Extraction Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - extraction
    paths:
      - '.github/workflows/android-apk.yml'
      - '**/*.gradle'
      - 'gradle/**'
      - 'gradle.properties'
      - 'gradlew'
      - 'android/**'
      - 'core/**'
      - 'EXTRACTION_README_KO.md'
      - 'SPD-classes/**'
      - 'services/**'

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: 'false'

      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew :core:test :android:assembleDebug --no-daemon --stacktrace

      - name: Save APK and checksum
        run: |
          mkdir -p apk-output
          cp android/build/outputs/apk/debug/*.apk apk-output/
          cd apk-output
          sha256sum *.apk > SHA256SUMS.txt

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: echo-extraction-debug-apk
          path: apk-output/
          if-no-files-found: error
          retention-days: 14
