name: Extraction Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - extraction
    paths:
      - '.github/workflows/android-apk.yml'
      - '**/*.gradle'
      - 'gradle/**'
      - 'gradle.properties'
      - 'gradlew'
      - 'android/**'
      - 'core/**'
      - 'scripts/android-smoke.py'
      - 'EXTRACTION_README_KO.md'
      - 'SPD-classes/**'
      - 'services/**'

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: 'false'

      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew :core:test :android:assembleDebug --no-daemon --stacktrace

      - name: Save APK and checksum
        run: |
          mkdir -p apk-output
          cp android/build/outputs/apk/debug/*.apk apk-output/
          cd apk-output
          sha256sum *.apk > SHA256SUMS.txt

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: echo-extraction-debug-apk
          path: apk-output/
          if-no-files-found: error
          retention-days: 14
      - name: Upload save-state test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extraction-save-tests
          path: core/build/test-results/test/*.xml
          if-no-files-found: ignore
  smoke:
    name: Test APK launch and resume on Android
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Download the built APK
        uses: actions/download-artifact@v4
        with:
          name: echo-extraction-debug-apk
          path: apk
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test original engine in Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swangle -noaudio -no-boot-anim -camera-back none
          script: python3 scripts/android-smoke.py
      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extraction-android-runtime
          path: android-smoke/
          if-no-files-found: ignore
