name: Publish Farming Pixel Dungeon v0.30
on:
  workflow_dispatch:
  push:
    branches: [extraction]
    paths: ['.github/workflows/publish-v030.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-farming-v030
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Download verified Android build
        uses: actions/download-artifact@v4
        with:
          name: echo-extraction-debug-apk
          run-id: 37711831677
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: release-input/android
      - name: Download verified Windows build
        uses: actions/download-artifact@v4
        with:
          name: farming-pc-windows
          run-id: 37711831874
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: release-input/windows
      - name: Stage the previously tested files
        run: |
          (cd release-input/android && sha256sum -c SHA256SUMS.txt)
          (cd release-input/windows && sed -i 's/\r$//' SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
          mkdir -p release-output
          cp release-input/android/android-debug.apk release-output/Farming_Pixel_Dungeon_v0.30.apk
          cp release-input/windows/Farming_Pixel_Dungeon_PC_v0.30_Windows.zip release-output/
          cd release-output
          sha256sum *.apk *.zip > SHA256SUMS.txt
      - name: Write bilingual release notes
        run: |
          cat > release-notes.md <<'NOTES'
          # 파밍픽셀던전 v0.30 / Farming Pixel Dungeon v0.30
          
          **Shattered Pixel Dungeon 모딩 작품입니다. AI를 사용했습니다.**
          **A mod of Shattered Pixel Dungeon, developed with AI assistance.**
          
          장비를 준비해 5층 원정을 떠나고 보스를 처치한 뒤 탈출해 장비와 성장 노드를 쌓는 게임입니다.
          
          ## 한국어 변경 사항
          - **성장 지도 투명도:** 창 자체뿐 아니라 로비의 어두운 가림막과 지도 안의 불투명 배경을 수정했습니다. 창은 88% 투명하며 뒤의 움직이는 배경이 실제로 비쳐 보입니다. 노드와 글자의 선명도는 유지합니다.
          - **내 원정 기록:** 로비 오른쪽 위 **기록**에서 원작의 개인 플레이 기록창을 엽니다. 새 사망 원정은 사망 원인, 도달 층, 점수, 당시 캐릭터와 장비를 저장합니다. 기록에서 로비로 돌아올 수 있으며, 원정 중 기록을 봐도 저장된 원정 이어하기는 유지됩니다.
          - **중복 사망 기록 방지:** 몬스터의 추가 사망 처리에서도 한 번의 사망은 한 번만 기록됩니다. 이전 버전에서 저장되지 않은 사망 기록은 복원되지 않습니다.
          - **연금술 탭:** 준비·성장·원정·상점·의뢰·연금술의 여섯 탭으로 정리했습니다. 창고 옆의 작은 물약 구매 버튼을 제거하고, 연금술 탭에 큰 **연금술 열기** 버튼을 배치했습니다. 물약 구매는 상점을 이용합니다.
          
          ## English changes
          Farming Pixel Dungeon is an equipment-farming mod built around five-floor expeditions, extraction, and permanent growth nodes.
          
          - **Growth-map transparency:** Removed the opaque hub shade and reduced the map's opaque backing. The window is 88% transparent, revealing the animated scene behind it while keeping text and nodes clear.
          - **Personal expedition records:** Open **기록** at the hub's top right to use the original personal records screen. New deaths save their cause, floor, score, character, and equipment. Records return to the hub, and viewing a record does not overwrite the active expedition save.
          - **One record per death:** Additional monster death callbacks do not create duplicate entries. Deaths not saved by older releases cannot be recovered.
          - **Six hub tabs:** Preparation, Growth, Expedition, Shop, Contracts, and Alchemy. Removed the small quick-potion-purchase button and moved alchemy access to its own tab with a full-width entry button. Potions remain available in the shop.
          
          ## 실행 / Playing
          - Android: install the APK below.
          - Windows 64-bit: extract the entire ZIP and run `FarmingPixelDungeon/FarmingPixelDungeon.exe`. Java is bundled.
          - 게임 UI는 한국어입니다. The game interface currently uses Korean labels.
          
          ## 검증 / Validation
          140 core tests passed, covering actual expedition deaths, cause and equipment persistence, duplicate prevention, and resuming after reading a record. Android compilation and Windows native startup, growth-map, and alchemy-screen checks passed. This is an in-development build.
          
          ## Credits / 제작자와 원작
          **gmray0126** — mod creator, design, and maintenance. **Evan Debenham / 00-Evan** — Shattered Pixel Dungeon. **Oleg Dolya / Watabou** — original Pixel Dungeon. Thanks to the upstream contributors for code, art, music, and translations. Upstream credits do not imply participation in or endorsement of this mod. AI assistance was used. Existing copyright notices are retained under GPL v3 or later.
          
          [게임 소개 / Project overview](https://github.com/gmray0126/farming-pixel-dungeon#readme) · [모딩 소스 / Mod source](https://github.com/gmray0126/farming-pixel-dungeon/tree/f868e8b97296007feed736d7c73d3d07ea947477)
          NOTES
      - name: Publish Android and Windows downloads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v0.30.0-farming release-output/* --repo gmray0126/farming-pixel-dungeon --target f868e8b97296007feed736d7c73d3d07ea947477 --title '파밍픽셀던전 v0.30 / Farming Pixel Dungeon' --notes-file release-notes.md --prerelease
