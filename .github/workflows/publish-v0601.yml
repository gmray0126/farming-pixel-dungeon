name: Publish Farming Pixel Dungeon v0.60.1
on:
  workflow_dispatch:
  push:
    branches: [extraction]
    paths: ['.github/workflows/publish-v0601.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-farming-v0601
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Download verified Android build
        uses: actions/download-artifact@v4
        with:
          name: echo-extraction-debug-apk
          run-id: 38518279290
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: release-input/android
      - name: Download verified Windows build
        uses: actions/download-artifact@v4
        with:
          name: farming-pc-windows
          run-id: 38518000559
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: release-input/windows
      - name: Stage the previously tested files
        run: |
          (cd release-input/android && sha256sum -c SHA256SUMS.txt)
          (cd release-input/windows && sed -i 's/\r$//' SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
          mkdir -p release-output
          cp release-input/android/android-debug.apk release-output/Farming_Pixel_Dungeon_v0.60.1.apk
          cp release-input/windows/Farming_Pixel_Dungeon_PC_v0.60.1_Windows.zip release-output/
          cp core/src/main/assets/sprites/huntress.png release-output/Huntress_Original_256x128.png
          cd release-output
          sha256sum *.apk *.zip *.png > SHA256SUMS.txt
      - name: Write bilingual release notes
        run: |
          cat > release-notes.md <<'NOTES'
          # 파밍픽셀던전 v0.60.1 / Farming Pixel Dungeon v0.60.1
          
          **Shattered Pixel Dungeon 모딩 작품입니다. AI를 사용했습니다.**
          **A mod of Shattered Pixel Dungeon, developed with AI assistance.**
          
          ## 한국어 변경 사항
          - v0.60.0의 장착 투척무기 동작을 수정했습니다. 장착하고 적을 누르면 자동으로 던지는 대신 근접무기로 공격합니다.
          - 장착 평타는 수량과 내구도를 소모하지 않습니다. 한 개만 남아 있어도 계속 사용할 수 있습니다.
          - 근접 공격에는 투척무기의 근접 명중 불이익을 적용하지 않으며 근접 특성과 노드가 적용됩니다.
          - 투척 단검·쿠나이·수리검·가시·다트는 단검 계통, 창류는 창 계통, 토마호크는 도끼 계통, 돌·곤봉·망치·부메랑·볼라·힘의 큐브는 둔기 계통으로 근접 성장합니다. 상세창에 근접/투척 계통을 함께 표시합니다.
          - 투척의 반지와 원거리 전용 특성은 실제로 던질 때 적용합니다. 다트를 손에 들고 때리는 공격에는 석궁의 충전 사격이 적용되지 않습니다.
          - 가방·퀵슬롯의 던지기를 선택하면 기존 투척 동작을 사용할 수 있으며, 실제 투척에서만 수량·내구도·회수 규칙을 적용합니다.
          - 장착·해제, 출격 자동 장착, 저장, 회수한 같은 묶음 합치기는 유지합니다.
          
          ## English changes
          - Corrected v0.60.0's equipped-projectile behavior: selecting an enemy now performs a melee attack instead of automatically throwing.
          - Equipped melee attacks do not consume quantity or durability, including with a single projectile remaining.
          - Melee attacks have no point-blank throwing penalty and use melee talents and the matching growth path.
          - Knives, kunai, shurikens, spikes, and darts use dagger growth; spears use spear growth; tomahawks use axe growth; remaining blunt-shaped missiles use blunt growth. Item details show both melee and throwing paths.
          - Sharpshooting and ranged-only traits apply to actual throws. Melee darts do not trigger crossbow charged shots.
          - Inventory/quickslot Throw remains available, with normal projectile quantity, durability, and recovery rules.
          - Equip/Unequip, expedition auto-equipping, save persistence, and recovery merging remain supported.
          
          ## 실행 / Playing
          - Android: install the APK below.
          - Windows 64-bit: extract the entire ZIP and run `FarmingPixelDungeon/FarmingPixelDungeon.exe`. Java is bundled.
          - 게임 UI는 한국어입니다. The game interface currently uses Korean labels.
          
          ## 검증 / Validation
          233 core regression tests and the Android build passed. Native Windows launch, departure, resume, portrait UI, ammunition-guide scrolling, and training checks passed. This is an in-development build.
          
          ## Credits / 제작자와 원작
          **gmray0126** — mod creator, design, and maintenance. **Evan Debenham / 00-Evan** — Shattered Pixel Dungeon. **Oleg Dolya / Watabou** — original Pixel Dungeon. Thanks to upstream contributors for code, art, music, and translations. Upstream credits do not imply participation in or endorsement of this mod. AI assistance was used. Existing copyright notices are retained under GPL v3 or later.
          
          [게임 소개 / Project overview](https://github.com/gmray0126/farming-pixel-dungeon#readme) · [검증한 소스 / Tested source](https://github.com/gmray0126/farming-pixel-dungeon/tree/44bcdc5533ced10ff6dadb016fc201e18e617a62)
          NOTES
      - name: Publish Android and Windows downloads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v0.60.1-farming release-output/* --repo gmray0126/farming-pixel-dungeon --target "${{ github.sha }}" --title '파밍픽셀던전 v0.60.1 / Farming Pixel Dungeon' --notes-file release-notes.md --prerelease
