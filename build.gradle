buildscript {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://repo1.maven.org/maven2' }
    }
    dependencies {
        if(!gradle.startParameter.projectProperties.containsKey('desktopOnly'))classpath 'com.android.tools.build:gradle:9.2.0'
    }
}

allprojects {

    ext {
        appName = '파밍 픽셀 던전'
        appPackageName = 'com.kwrousagi.echoextraction'

        //Full releases gets +2 on version code, needed for an F-Droid quirk
        appVersionCode = 991
        appVersionName = '0.61.0-farming'

        appJavaCompatibility = JavaVersion.VERSION_11

        appAndroidCompileSDK = 36   //Android 15
        appAndroidMinSDK = 21       //Android 5.0
        appAndroidTargetSDK = 36    //Android 15

        gdxVersion = '1.14.0'
        gdxControllersVersion = '2.2.4'
        robovmVersion = '2.3.24'
    }
    version = appVersionName

    repositories {
        google()
        mavenCentral()
        maven { url 'https://repo1.maven.org/maven2' }
        maven { url 'https://central.sonatype.com/repository/maven-snapshots/' }
    }

}
